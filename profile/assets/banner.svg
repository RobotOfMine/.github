<!-- Black-and-gold organization profile banner; self-contained SVG for GitHub. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">RobotOfMine</title>
<desc id="desc">A playground for Minecraft automation. Build. Connect. Automate. Gold blocks connected by a dotted path on a black background.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171717"/><stop offset="1" stop-color="#080808"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#d4af37" stop-opacity=".16"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1200" height="420" rx="20" fill="url(#bg)"/>
<rect width="1200" height="420" rx="20" fill="url(#grid)"/>
<ellipse cx="972" cy="190" rx="320" ry="280" fill="url(#glow)"/>
<path d="M54 0H1146" stroke="#d4af37" stroke-width="3"/>
<g font-family="Arial, Helvetica, sans-serif">
  <rect x="58" y="58" width="9" height="9" rx="1" fill="#d4af37"/>
  <text x="80" y="68" fill="#d4af37" font-size="14" font-weight="700" letter-spacing="3">MINECRAFT AUTOMATION</text>
  <text x="54" y="170" fill="#f5f5f5" font-size="78" font-weight="750" letter-spacing="-4">Robot<tspan fill="#e8c65b">OfMine</tspan></text>
  <text x="58" y="232" fill="#f5f5f5" font-size="33" font-weight="600" letter-spacing="-.7">Build. Connect. Automate.</text>
  <text x="58" y="275" fill="#b8b8b8" font-size="21">A playground for Minecraft automation.</text>
  <path d="M58 323H112" stroke="#d4af37" stroke-width="3"/>
  <text x="58" y="368" fill="#a7a7a7" font-size="14" letter-spacing="2">YOUR IDEAS. YOUR BOTS. YOUR WORLD.</text>
</g>
<g fill="none" stroke="#d4af37" stroke-width="2">
